<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>n-dim-particle-life</title>
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body>
    <div id="app">
      <div class="controls">
        <label>
          Preferred Particle Count
          <input type="number" id="preferredParticleCount" class="controls__input" value="2000" min="16" max="100000">
        </label>
        <label>
          Group Count
          <input type="number" id="groupCount" class="controls__input" value="5" min="1" max="16">
        </label>
        <hr>
        <label>
          Dimensions
          <input type="number" id="dimensions" class="controls__input" value="2" min="0" max="16">
        </label>
        <label>
          Seed
          <input type="number" id="seed" class="controls__input" value="1000" min="0" max="10000">
        </label>
        <label>
          Relation Scale
          <input type="number" id="relationScale" class="controls__input" value="1.0" step="0.1" min="-100" max="100">
        </label>
        <label>
          Time Step
          <input type="number" id="timeStep" class="controls__input" value="0.02" step="0.001" min="0.001" max="1">
        </label>
        <label>
          Friction Half-Life
          <input type="number" id="frictionHalfLife" class="controls__input" value="0.04" step="0.01" min="0" max="1">
        </label>
        <label>
          Max Range
          <input type="number" id="rMax" class="controls__input" value="0.15" step="0.02" min="0.01" max="10">
        </label>
        <label>
          Visual Particle Size
          <input type="number" id="particleSize" class="controls__input" value="16.0" step="0.1" min="0.1" max="100">
        </label>
        <hr>
        <label for="headless" class="controls__headless-label">
          <input type="checkbox" id="headless" unchecked>
          Headless Mode
        </label>
        <div class="controls__headless hidden">
          <label>
            Iterations
            <input type="number" id="headless-iterations" class="controls__input" value="10" min="1" max="100">
          </label>
          <label for="">
            Itertion Time
            <input type="number" id="headless-iteration-time" class="controls__input" value="60" step="10" min="1" max="600">
          </label>
        </div>
        <hr>
        <button id="apply">Run</button>
        <canvas id="live-chart" class="chart"></canvas>
        <div class="controls__spacer"></div>
      </div>
      <canvas id="canvas"></canvas>
      <div id="headless-container" class="hidden">
        <canvas id="headless-chart" class="chart"></canvas>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
