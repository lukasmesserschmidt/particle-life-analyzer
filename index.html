<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>n-dim-particle-life</title>
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body>
    <div id="app">
      <div class="controls">
        <label>
          Preferred Particle Count
          <input type="number" id="preferredParticleCount" class="controls__input" value="3000" min="16" max="100000">
        </label>
        <label>
          Group Count
          <input type="number" id="groupCount" class="controls__input" value="3" min="1" max="16">
        </label>
        <hr>
        <label>
          Dimensions
          <input type="number" id="dimensions" class="controls__input" value="2" min="0" max="16">
        </label>
        <label>
          Seed
          <input type="number" id="seed" class="controls__input" value="0" min="0" max="10000">
        </label>
        <label>
          Relation Scale
          <input type="number" id="relationScale" class="controls__input" value="1.0" step="0.1" min="-100" max="100">
        </label>
        <label>
          Time Step
          <input type="number" id="timeStep" class="controls__input" value="0.02" step="0.001" min="0.001" max="1">
        </label>
        <label>
          Friction Half-Life
          <input type="number" id="frictionHalfLife" class="controls__input" value="0.04" step="0.01" min="0" max="1">
        </label>
        <label>
          Max Range
          <input type="number" id="rMax" class="controls__input" value="0.3" step="0.02" min="0.01" max="10">
        </label>
        <label>
          Visual Particle Size
          <input type="number" id="particleSize" class="controls__input" value="16.0" step="0.1" min="0.1" max="100">
        </label>
        <hr>
        <button id="apply">Apply</button>
        <canvas id="stats-chart" class="chart"></canvas>
        <div class="controls__spacer"></div>
      </div>
      <canvas id="canvas"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
